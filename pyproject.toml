[project]
name = "agentic-ui-builder"
version = "0.1.0"
description = "Agentic UI/UX generation: LLM designs a compact DSL, deterministic engine expands it."
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "structlog>=24.1",
    "typer>=0.12",
    "pillow>=10",
    "httpx>=0.27",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
uib = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a browser and the built frontend bundle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["B008"]  # typer declares CLI options in argument defaults

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

# The deterministic engine must never import the LLM layer.
[[tool.importlinter.contracts]]
name = "Deterministic engine is LLM-free"
type = "forbidden"
source_modules = ["app.dsl", "app.layout", "app.animation", "app.catalog", "app.renderer", "app.tokens", "app.recipes", "app.imagery"]
forbidden_modules = [
    "app.core.llm", "app.agents",
    "langchain", "langchain_core", "langchain_openai", "langchain_anthropic", "openai",
]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
